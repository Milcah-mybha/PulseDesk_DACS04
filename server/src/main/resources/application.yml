server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pulsedesk-server

  data:
    mongodb:
      # Kết nối trực tiếp tới MongoDB Atlas Cluster0 của PulseDesk
      # Kết nối trực tiếp tới MongoDB Atlas Cluster0 của PulseDesk
      uri: ${MONGODB_URI:mongodb+srv://buihamy2006_db_user:RSFXUkFgsrW3oeCH@cluster0.0bo9ldx.mongodb.net/pulsedesk?authSource=admin&retryWrites=true&w=majority}
      database: ${MONGODB_DATABASE:pulsedesk}
      # Tự động tạo index theo khai báo @Indexed và @CompoundIndex trong Document
      auto-index-creation: true

pulsedesk:
  mongodb:
    # Cấu hình Connection Pool & Timeout tối ưu cho hệ thống Real-time TCP Socket
    min-pool-size: ${MONGODB_MIN_POOL_SIZE:10}
    max-pool-size: ${MONGODB_MAX_POOL_SIZE:100}
    max-wait-time-ms: ${MONGODB_MAX_WAIT_TIME_MS:2000}
    connect-timeout-ms: ${MONGODB_CONNECT_TIMEOUT_MS:3000}
    socket-timeout-ms: ${MONGODB_SOCKET_TIMEOUT_MS:5000}
    server-selection-timeout-ms: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:3000}
  
  tcp-server:
    port: ${TCP_SERVER_PORT:8888}
    worker-threads: ${TCP_WORKER_THREADS:16}

# Cấu hình Spring Boot Actuator Health Check
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.data.mongodb: INFO
    com.pulsedesk: DEBUG
